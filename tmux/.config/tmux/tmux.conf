# Reload Config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Bind mouse
set -g mouse on

# Set vi mode keys
setw -g mode-keys vi

# Copy to System clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"

# Start window numbering from 1
set -g base-index 1

# Renumber all windows on close
set -g renumber-windows on

set-option -g status-position top

# pi code recommended settings
set -g extended-keys on
set -g extended-keys-format csi-u

# Catppuccin configs
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
# Pane related configs for catpuccin theme
set -g @catppuccin_pane_border_style 'fg=white'
set -g @catppuccin_pane_active_border_style 'fg=brightcyan'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Optional: auto-save every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-save-interval '15'   # auto-save every 15 minutes
set -g @continuum-restore 'on'         # auto-restore last session on tmux start

set-hook -g client-detached 'run-shell -b "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"'


# Run command for tpm
run '~/.config/tmux/plugins/tpm/tpm'


# Make these the defaults for all windows
setw -g pane-border-status bottom
setw -g pane-border-format '#[fg=white,bold] #P #{?pane_title,#{pane_title},#{pane_current_command}} #[default]'

# Keep text on inactive pane
set -g pane-border-style 'fg=white'
set -g pane-active-border-style 'fg=brightcyan'

# arrows/colors hints for the active pane
set -g pane-border-indicators both



# Key binding to rename current pane
bind t command-prompt -p "Pane title:" 'select-pane -T "%%"'
